version: '3.9'
services:
  redis:
    image: redis:7.2-alpine
    container_name: distributed-rl-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distributed-rl-app
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  console:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: distributed-rl-console
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy target. The browser only ever talks to the console.
      BACKEND_URL: http://app:8080
    depends_on:
      - app

volumes:
  redis-data:
